# Tilarivi: yksi markdown-kortti, joka tekee useasta entiteetistä otsikon ja lauseen.
# Laita se dashboard-osion ensimmäiseksi. Käy tapaukset läpi kiireellisimmästä alkaen; ensimmäinen osuma voittaa.
type: markdown
text_only: true
grid_options:
  columns: full
content: |-
  {%- set temp = states('sensor.outdoor_temperature') | float(none) -%}
  {%- if not has_value('switch.device') -%}
  ## Laite ei vastaa
  Pistorasia ei ole yhteydessä. Tarkista virta ja Wi-Fi.
  {%- elif is_state('switch.device', 'on') -%}
  ## Käynnissä
  Päällä klo {{ (states.switch.device.last_changed | as_local).strftime('%H:%M') }} alkaen.
  {%- elif is_state('input_boolean.device_schedule', 'off') -%}
  ## Ajastus pois
  Mitään ei käynnisty, ennen kuin kytket sen itse.
  {%- else -%}
  {%- set next = today_at(states('sensor.device_next_run')) -%}
  {%- if next < now() -%}{%- set next = next + timedelta(days=1) -%}{%- endif %}
  ## Seuraava ajo klo {{ states('sensor.device_next_run') }}
  {%- set mins = ((next - now()).total_seconds() // 60) | int %}
  Siihen on {{ mins // 60 }} h {{ mins % 60 }} min.
  {%- endif -%}
