# Yhden auton dashboard-osio. Sections-näkymässä: lisää osio → ⋮ → Muokkaa YAML:na ja liitä tämä.
type: 'grid'
cards:
  - type: 'heading'
    heading: 'Auto'
    heading_style: 'title'
    icon: 'mdi:car'
    badges:
      - type: 'entity'
        entity: 'sensor.outdoor_temperature'
        name: 'Ulkona'
        show_name: false
        show_icon: true
        icon: 'mdi:thermometer'
        show_state: true
  - type: 'markdown'
    text_only: true
    content: |-
      {%- set t = states('sensor.outdoor_temperature') | float(none) -%}
      {%- set tt = (t | round(1) | string) | replace('.', ',') if t is not none else '–' -%}
      {%- set dur = states('sensor.car_heating_time') | int(0) -%}
      {%- set dep = states('input_datetime.car_departure_time')[:5] -%}
      {%- if is_state('switch.car_block_heater','on') and is_state('input_boolean.car_heating_schedule','off') -%}
      ## Lämmitin päällä
      Ajastus on pois, joten lämmitin on päällä, kunnes sammutat sen.
      {%- elif is_state('switch.car_block_heater','on') -%}
      ## Lämmitys päällä
      Valmis lähtöön klo {{ dep }}.
      {%- elif is_state('input_boolean.car_heating_schedule','off') -%}
      ## Ajastus pois
      Lämmitin on päällä vain, kun kytket sen itse.
      {%- elif dur == 0 -%}
      ## Lämmitystä ei tarvita
      Ulkona on {{ tt }} °C. Auto on valmis klo {{ dep }} sellaisenaan.
      {%- else -%}
      ## Lämmitys alkaa klo {{ states('sensor.car_heating_starts') }}
      {{ dur }} minuuttia, kun ulkona on {{ tt }} °C. Lämmin klo {{ dep }}.
      {%- endif -%}
    grid_options:
      columns: 'full'
  - type: 'tile'
    entity: 'switch.car_block_heater'
    name: 'Lämmitin'
    icon: 'mdi:car-seat-heater'
    vertical: false
    grid_options:
      columns: 6
    tap_action:
      action: 'toggle'
    icon_tap_action:
      action: 'toggle'
    hide_state: true
  - type: 'tile'
    entity: 'input_boolean.car_heating_schedule'
    name: 'Ajastettu lämmitys'
    icon: 'mdi:calendar-clock'
    vertical: false
    grid_options:
      columns: 6
    tap_action:
      action: 'toggle'
    icon_tap_action:
      action: 'toggle'
  - type: 'tile'
    entity: 'input_datetime.car_departure_time'
    name: 'Lähtöaika'
    icon: 'mdi:clock-outline'
    vertical: false
    grid_options:
      columns: 6
  - type: 'tile'
    entity: 'sensor.car_heating_time'
    name: 'Lämmitysaika'
    icon: 'mdi:timer-outline'
    vertical: false
    grid_options:
      columns: 6
  - type: 'entities'
    title: 'Lämmitysajat'
    state_color: false
    grid_options:
      columns: 'full'
    entities:
      - entity: 'input_number.car_heating_minus_20'
        name: '−20 °C tai kylmempää'
        icon: 'mdi:thermometer'
      - entity: 'input_number.car_heating_minus_10'
        name: '−10 … −20 °C'
        icon: 'mdi:thermometer'
      - entity: 'input_number.car_heating_minus_5'
        name: '−5 … −10 °C'
        icon: 'mdi:thermometer'
      - entity: 'input_number.car_heating_below_5'
        name: 'alle +5 °C'
        icon: 'mdi:thermometer'
