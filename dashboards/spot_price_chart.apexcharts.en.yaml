# Optional price chart. Needs apexcharts-card from HACS. Add it to the section as a card (Edit in YAML).
type: custom:apexcharts-card
header:
  show: true
  title: Spot price today (c/kWh incl. VAT and margin)
graph_span: 24h
span:
  start: day
now:
  show: true
  label: now
yaxis:
  - min: ~0
    decimals: 2
series:
  # The whole day's 15-minute prices from the attribute of sensor.electricity_prices
  - entity: sensor.electricity_prices
    name: Spot price
    type: column
    color: '#5c9ece'
    unit: ' c/kWh'
    float_precision: 2
    data_generator: |
      const d0 = new Date(); d0.setHours(0, 0, 0, 0);
      const s = d0.getTime(), e = s + 86400000;
      return entity.attributes.prices
        .filter((p) => p.ts * 1000 >= s && p.ts * 1000 < e)
        .map((p) => [p.ts * 1000, p.p]);
  # The same bars highlighted for the cheapest window
  - entity: sensor.electricity_prices
    name: Cheapest window
    type: column
    color: '#57bb8a'
    unit: ' c/kWh'
    float_precision: 2
    data_generator: |
      const d0 = new Date(); d0.setHours(0, 0, 0, 0);
      const s = d0.getTime(), e = s + 86400000;
      const w = hass.states['sensor.cheapest_window_start'];
      const ws = w && w.attributes.end ? new Date(w.state).getTime() : 0;
      const we = w && w.attributes.end ? new Date(w.attributes.end).getTime() : 0;
      return entity.attributes.prices
        .filter((p) => p.ts * 1000 >= s && p.ts * 1000 < e)
        .map((p) => [p.ts * 1000, p.ts * 1000 >= ws && p.ts * 1000 < we ? p.p : null]);
