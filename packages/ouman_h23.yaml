# Ouman H23 district heating controller over Modbus: read-only monitoring.
# Save as config/packages/ouman_h23.yaml (packages must be enabled in configuration.yaml).
#
# Connection: a Modbus TCP-to-RTU gateway (RS-485 to Ethernet) wired to the H23's RS-485 port.
# Put the gateway's address in secrets.yaml, for example:  ouman_host: 192.168.1.50 Register addresses follow the official
# H23 v2.0.1 Modbus register list. Values are 32-bit, read here as the low 16-bit word,
# which covers every value this package uses.
#
# L1 = heating circuit 1, DHW = domestic hot water.
# This package only reads. Nothing here writes to the controller.
# Alarm and connection notifications: blueprint heating_controller_watchdog.yaml.
#
# Some unique_ids are in Finnish: they come from the first version of this package and
# are kept so that upgraded installs keep their entity IDs and history.

modbus:
  - name: ouman_h23
    type: tcp
    host: !secret ouman_host
    port: 502
    delay: 1
    timeout: 5

    sensors:
      # ---------- Measurements ----------
      - name: Ouman outdoor temperature
        unique_id: ouman_h23_ulko
        slave: 1
        address: 201
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      - name: Ouman L1 supply temperature
        unique_id: ouman_h23_l1_meno
        slave: 1
        address: 203
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      - name: Ouman L1 return temperature
        unique_id: ouman_h23_l1_paluu
        slave: 1
        address: 205
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      - name: Ouman DHW supply temperature
        unique_id: ouman_h23_lv_meno
        slave: 1
        address: 215
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      - name: Ouman DHW circulation temperature
        unique_id: ouman_h23_lv_kierto
        slave: 1
        address: 217
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      # ---------- Control ----------
      - name: Ouman L1 supply setpoint
        unique_id: ouman_h23_l1_asetus_laskennall
        slave: 1
        address: 285 # calculated supply water setpoint
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      - name: Ouman L1 setpoint from curve
        unique_id: ouman_h23_l1_kayra
        slave: 1
        address: 287 # supply water according to the heating curve
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement

      - name: Ouman L1 valve position
        unique_id: ouman_h23_l1_venttiili_asento
        slave: 1
        address: 613
        input_type: holding
        data_type: int16
        unit_of_measurement: '%'
        state_class: measurement

      - name: Ouman L1 summer shutdown raw
        unique_id: ouman_h23_l1_kesasulku
        slave: 1
        address: 293 # 1 = summer shutdown active
        input_type: holding
        data_type: uint16

      - name: Ouman DHW setpoint
        unique_id: ouman_h23_lv_asetus
        slave: 1
        address: 593
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
      - name: Ouman DHW valve position
        unique_id: ouman_h23_lv_venttiili
        slave: 1
        address: 225
        input_type: holding
        data_type: int16
        unit_of_measurement: '%'
        state_class: measurement

      - name: Ouman delayed outdoor temperature
        unique_id: ouman_h23_ulko_hidastettu
        slave: 1
        address: 279 # the smoothed outdoor value the controller actually uses
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        scan_interval: 60

      # ---------- L1 heating curve (whole degrees, read every 10 min) ----------
      # The end points are fixed at -20 °C and +20 °C outdoors.

      # How much room compensation is shifting the supply setpoint right now
      - name: Ouman L1 room compensation effect
        unique_id: ouman_h23_l1_huonekomp_vaikutus
        slave: 1
        address: 289
        input_type: holding
        data_type: int16
        scale: 0.1
        precision: 1
        unit_of_measurement: °C
        state_class: measurement
        scan_interval: 60
      - name: Ouman L1 curve point 1 supply
        unique_id: ouman_h23_l1_kayra_out1
        slave: 1
        address: 502
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 curve point 2 outdoor
        unique_id: ouman_h23_l1_kayra_in2
        slave: 1
        address: 504
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 curve point 2 supply
        unique_id: ouman_h23_l1_kayra_out2
        slave: 1
        address: 506
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 curve point 3 outdoor
        unique_id: ouman_h23_l1_kayra_in3
        slave: 1
        address: 508
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 curve point 3 supply
        unique_id: ouman_h23_l1_kayra_out3
        slave: 1
        address: 510
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 curve point 4 outdoor
        unique_id: ouman_h23_l1_kayra_in4
        slave: 1
        address: 512
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 curve point 4 supply
        unique_id: ouman_h23_l1_kayra_out4
        slave: 1
        address: 514
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 curve point 5 supply
        unique_id: ouman_h23_l1_kayra_out5
        slave: 1
        address: 516
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 supply minimum
        unique_id: ouman_h23_l1_meno_min
        slave: 1
        address: 518
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600
      - name: Ouman L1 supply maximum
        unique_id: ouman_h23_l1_meno_max
        slave: 1
        address: 520
        input_type: holding
        data_type: int16
        unit_of_measurement: °C
        scan_interval: 600

      # ---------- Alarms (raw; bit 0 = active) ----------
      - name: Ouman alarm raw DHW high temperature
        unique_id: ouman_h23_alarm_lv_ylalampo
        slave: 1
        address: 532
        input_type: holding
        data_type: uint16
      - name: Ouman alarm raw L1 supply deviation
        unique_id: ouman_h23_alarm_l1_poikkeama
        slave: 1
        address: 533
        input_type: holding
        data_type: uint16
      - name: Ouman alarm raw L1 return low
        unique_id: ouman_h23_alarm_l1_paluu_ala
        slave: 1
        address: 674
        input_type: holding
        data_type: uint16
      - name: Ouman alarm raw sensor M1 outdoor
        unique_id: ouman_h23_alarm_m1
        slave: 1
        address: 643
        input_type: holding
        data_type: uint16
      - name: Ouman alarm raw sensor M2 L1 supply
        unique_id: ouman_h23_alarm_m2
        slave: 1
        address: 644
        input_type: holding
        data_type: uint16
      - name: Ouman alarm raw sensor M3 L1 return
        unique_id: ouman_h23_alarm_m3
        slave: 1
        address: 645
        input_type: holding
        data_type: uint16
      - name: Ouman alarm raw sensor M8 DHW supply
        unique_id: ouman_h23_alarm_m8
        slave: 1
        address: 650
        input_type: holding
        data_type: uint16
      - name: Ouman alarm raw sensor M9 DHW circulation
        unique_id: ouman_h23_alarm_m9
        slave: 1
        address: 651
        input_type: holding
        data_type: uint16

template:
  - sensor:
      # Supply minus return: how much heat the radiators or floor loops take out
      - name: Ouman L1 temperature drop
        unique_id: ouman_h23_l1_dt
        unit_of_measurement: °C
        state_class: measurement
        state: >
          {{ (states('sensor.ouman_l1_supply_temperature') | float
              - states('sensor.ouman_l1_return_temperature') | float) | round(1) }}
        availability: >
          {{ has_value('sensor.ouman_l1_supply_temperature')
             and has_value('sensor.ouman_l1_return_temperature') }}

      # Measured supply minus setpoint: positive = warmer than asked
      - name: Ouman L1 control error
        unique_id: ouman_h23_l1_saatovirhe
        unit_of_measurement: °C
        state_class: measurement
        state: >
          {{ (states('sensor.ouman_l1_supply_temperature') | float
              - states('sensor.ouman_l1_supply_setpoint') | float) | round(1) }}
        availability: >
          {{ has_value('sensor.ouman_l1_supply_temperature')
             and has_value('sensor.ouman_l1_supply_setpoint') }}

      # Hot water supply minus circulation return: heat lost in the circulation loop
      - name: Ouman DHW temperature drop
        unique_id: ouman_h23_lv_dt
        unit_of_measurement: °C
        state_class: measurement
        state: >
          {{ (states('sensor.ouman_dhw_supply_temperature') | float
              - states('sensor.ouman_dhw_circulation_temperature') | float) | round(1) }}
        availability: >
          {{ has_value('sensor.ouman_dhw_supply_temperature')
             and has_value('sensor.ouman_dhw_circulation_temperature') }}

  - binary_sensor:
      - name: Ouman L1 summer shutdown
        unique_id: ouman_h23_bs_l1_kesasulku
        state: "{{ states('sensor.ouman_l1_summer_shutdown_raw') | int(0) == 1 }}"

      - name: Ouman alarm DHW high temperature
        unique_id: ouman_h23_bs_lv_ylalampo
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_dhw_high_temperature') | int(0) % 2 == 1 }}"
      - name: Ouman alarm L1 supply deviation
        unique_id: ouman_h23_bs_l1_poikkeama
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_l1_supply_deviation') | int(0) % 2 == 1 }}"
      - name: Ouman alarm L1 return low
        unique_id: ouman_h23_bs_l1_paluu_ala
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_l1_return_low') | int(0) % 2 == 1 }}"
      - name: Ouman sensor fault M1 outdoor
        unique_id: ouman_h23_bs_m1
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_sensor_m1_outdoor') | int(0) % 2 == 1 }}"
      - name: Ouman sensor fault M2 L1 supply
        unique_id: ouman_h23_bs_m2
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_sensor_m2_l1_supply') | int(0) % 2 == 1 }}"
      - name: Ouman sensor fault M3 L1 return
        unique_id: ouman_h23_bs_m3
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_sensor_m3_l1_return') | int(0) % 2 == 1 }}"
      - name: Ouman sensor fault M8 DHW supply
        unique_id: ouman_h23_bs_m8
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_sensor_m8_dhw_supply') | int(0) % 2 == 1 }}"
      - name: Ouman sensor fault M9 DHW circulation
        unique_id: ouman_h23_bs_m9
        device_class: problem
        state: "{{ states('sensor.ouman_alarm_raw_sensor_m9_dhw_circulation') | int(0) % 2 == 1 }}"

      # No answer from the controller for 5 minutes
      - name: Ouman connection lost
        unique_id: ouman_h23_bs_offline
        device_class: problem
        state: "{{ not has_value('sensor.ouman_outdoor_temperature') }}"
        delay_on:
          minutes: 5

      - name: Ouman any alarm
        unique_id: ouman_h23_bs_any_alarm
        device_class: problem
        state: >
          {{ ['binary_sensor.ouman_alarm_dhw_high_temperature',
              'binary_sensor.ouman_alarm_l1_supply_deviation',
              'binary_sensor.ouman_alarm_l1_return_low',
              'binary_sensor.ouman_sensor_fault_m1_outdoor',
              'binary_sensor.ouman_sensor_fault_m2_l1_supply',
              'binary_sensor.ouman_sensor_fault_m3_l1_return',
              'binary_sensor.ouman_sensor_fault_m8_dhw_supply',
              'binary_sensor.ouman_sensor_fault_m9_dhw_circulation']
             | select('is_state', 'on') | list | count > 0 }}
