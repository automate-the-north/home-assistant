# Spot electricity price with VAT and margin, 15-minute periods, and the cheapest time window.
# Save as config/packages/spot_price.yaml (packages must be enabled in configuration.yaml).
#
# Requires Home Assistant's built-in Nord Pool integration. The entity IDs below assume
# area FI (sensor.nord_pool_fi_*); change "fi" and "FI" if you use another area.
#
# Formula: c/kWh = Nord Pool price × (1 + VAT) + margin
# Nord Pool prices exclude VAT. The margin is entered with VAT included, so it is added after.

# Settings, adjustable from the dashboard. Home Assistant remembers the values across restarts.
input_number:
  electricity_margin:
    name: Electricity margin (incl. VAT)
    min: 0
    max: 5
    step: 0.001
    mode: box
    unit_of_measurement: c/kWh
    icon: mdi:cash-plus
  electricity_vat:
    name: Electricity VAT
    min: 0
    max: 30
    step: 0.1
    mode: box
    unit_of_measurement: '%'
    icon: mdi:percent
  cheapest_window_minutes:
    name: Cheapest window length
    min: 15
    max: 300
    step: 15
    unit_of_measurement: min
    icon: mdi:timer-sand
  cheapest_window_earliest:
    name: Cheapest window earliest start
    min: 0
    max: 23
    step: 1
    unit_of_measurement: h
    icon: mdi:clock-start
  cheapest_window_latest:
    name: Cheapest window latest end
    min: 1
    max: 24
    step: 1
    unit_of_measurement: h
    icon: mdi:clock-end

template:
  # Current and next price. These update as soon as the Nord Pool sensors change.
  - sensor:
      - name: Electricity price now
        unique_id: electricity_price_now
        unit_of_measurement: c/kWh
        state_class: measurement
        icon: mdi:flash
        availability: "{{ has_value('sensor.nord_pool_fi_current_price') }}"
        state: >
          {% set vat = states('input_number.electricity_vat') | float(0) / 100 %}
          {% set margin = states('input_number.electricity_margin') | float(0) %}
          {{ (states('sensor.nord_pool_fi_current_price') | float(0) * 100 * (1 + vat) + margin) | round(2) }}

      # The Energy dashboard expects EUR/kWh. A c/kWh price would make costs 100 times too high.
      - name: Electricity price now EUR
        unique_id: electricity_price_now_eur
        unit_of_measurement: EUR/kWh
        state_class: measurement
        icon: mdi:currency-eur
        availability: "{{ has_value('sensor.nord_pool_fi_current_price') }}"
        state: >
          {% set vat = states('input_number.electricity_vat') | float(0) / 100 %}
          {% set margin = states('input_number.electricity_margin') | float(0) %}
          {{ (states('sensor.nord_pool_fi_current_price') | float(0) * (1 + vat) + margin / 100) | round(5) }}

      - name: Electricity price next
        unique_id: electricity_price_next
        unit_of_measurement: c/kWh
        icon: mdi:flash-outline
        availability: "{{ has_value('sensor.nord_pool_fi_next_price') }}"
        state: >
          {% set vat = states('input_number.electricity_vat') | float(0) / 100 %}
          {% set margin = states('input_number.electricity_margin') | float(0) %}
          {{ (states('sensor.nord_pool_fi_next_price') | float(0) * 100 * (1 + vat) + margin) | round(2) }}

      # cheap / normal / expensive compared with the average of the next 24 hours.
      # The percentage is in an attribute so a dashboard can word it in any language.
      - name: Electricity price level
        unique_id: electricity_price_level
        icon: mdi:gauge
        availability: "{{ states('sensor.electricity_price_average_24h') | float(0) > 0 }}"
        state: >
          {% set r = states('sensor.electricity_price_now') | float(0)
                     / states('sensor.electricity_price_average_24h') | float(1) %}
          {{ 'cheap' if r <= 0.8 else ('normal' if r <= 1.2 else 'expensive') }}
        attributes:
          percent_vs_average: >
            {% set r = states('sensor.electricity_price_now') | float(0)
                       / states('sensor.electricity_price_average_24h') | float(1) %}
            {{ ((r - 1) * 100) | round(0) | int }}

  # The full 15-minute price curve and the cheapest window. Runs every 15 minutes, when
  # Nord Pool publishes new prices, and when you change a setting.
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: /15
      - trigger: state
        entity_id: sensor.nord_pool_fi_last_updated
      - trigger: state
        entity_id:
          - input_number.electricity_margin
          - input_number.electricity_vat
          - input_number.cheapest_window_minutes
          - input_number.cheapest_window_earliest
          - input_number.cheapest_window_latest

    actions:
      - variables:
          entry: "{{ config_entry_id('sensor.nord_pool_fi_current_price') }}"

      # The Nord Pool day runs on Central European time. In Finland (one hour ahead) the
      # first hour of the local day is in the previous Nord Pool day, so fetch yesterday too.
      # A day that isn't published yet returns an empty list, not an error.
      - action: nordpool.get_prices_for_date
        data:
          config_entry: '{{ entry }}'
          date: '{{ (now() - timedelta(days=1)).date() }}'
          areas: [FI]
        response_variable: r_yesterday
      - action: nordpool.get_prices_for_date
        data:
          config_entry: '{{ entry }}'
          date: '{{ now().date() }}'
          areas: [FI]
        response_variable: r_today
      - action: nordpool.get_prices_for_date
        data:
          config_entry: '{{ entry }}'
          date: '{{ (now() + timedelta(days=1)).date() }}'
          areas: [FI]
        response_variable: r_tomorrow

      - variables:
          # One list from local midnight onwards: t = local ISO time, ts = epoch, p = c/kWh
          all_prices: >
            {% set vat = states('input_number.electricity_vat') | float(0) / 100 %}
            {% set margin = states('input_number.electricity_margin') | float(0) %}
            {% set cutoff = today_at('00:00').timestamp() %}
            {% set raw = (r_yesterday.FI | default([])) + (r_today.FI | default([]))
                       + (r_tomorrow.FI | default([])) %}
            {% set ns = namespace(out=[]) %}
            {% for x in raw %}
              {% set st = x.start | as_datetime %}
              {% if st.timestamp() >= cutoff %}
                {% set ns.out = ns.out + [{
                     't': (st | as_local).isoformat(),
                     'ts': st.timestamp() | int,
                     'p': ((x.price / 10.0) * (1 + vat) + margin) | round(3) }] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}

          # Cheapest continuous window that fits entirely between the earliest start and the
          # latest end. It shows the whole day's best window, even once it has passed;
          # after the latest end it moves on to tomorrow.
          best: >
            {% set n = ((states('input_number.cheapest_window_minutes') | float(60)) / 15)
                       | round(0, 'ceil') | int %}
            {% set h0 = states('input_number.cheapest_window_earliest') | int(0) %}
            {% set h1 = states('input_number.cheapest_window_latest') | int(24) %}
            {% set midnight = today_at('00:00') %}
            {% set nowts = now().timestamp() %}
            {% set d = 0 if nowts < (midnight + timedelta(hours=h1)).timestamp() else 1 %}
            {% set ws = (midnight + timedelta(days=d, hours=h0)).timestamp() %}
            {% set we = (midnight + timedelta(days=d, hours=h1)).timestamp() %}
            {% set cand = all_prices | selectattr('ts', 'ge', ws) | selectattr('ts', 'lt', we) | list %}
            {% set ns = namespace(start=none, avg=none, end=none, s_ts=0, e_ts=0) %}
            {% if n > 0 and h1 > h0 and cand | length >= n %}
              {% for i in range(0, (cand | length) - n + 1) %}
                {% set w = cand[i:i + n] %}
                {% if w[-1].ts + 900 <= we %}
                  {% set avg = (w | map(attribute='p') | sum) / n %}
                  {% if ns.avg is none or avg < ns.avg %}
                    {% set ns.avg = avg %}
                    {% set ns.start = w[0].t %}
                    {% set ns.end = (w[-1].ts + 900) | timestamp_local %}
                    {% set ns.s_ts = w[0].ts %}
                    {% set ns.e_ts = w[-1].ts + 900 %}
                  {% endif %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% set status = none if ns.start is none else
                            ('past' if ns.e_ts <= nowts else
                            ('active' if ns.s_ts <= nowts else 'upcoming')) %}
            {{ {'start': ns.start, 'end': ns.end, 'slots': n, 'day': d, 'status': status,
                'avg': (ns.avg | round(2)) if ns.avg is not none else none} }}

    sensor:
      # The price curve for charts. The state is the number of periods, so it has no unit.
      - name: Electricity prices
        unique_id: electricity_prices
        icon: mdi:chart-bar
        state: '{{ all_prices | count }}'
        attributes:
          prices: '{{ all_prices }}'
          tomorrow_available: '{{ (r_tomorrow.FI | default([]) | count) > 0 }}'

      - name: Electricity price average 24h
        unique_id: electricity_price_average_24h
        unit_of_measurement: c/kWh
        icon: mdi:chart-line
        availability: '{{ all_prices | count > 0 }}'
        state: >
          {% set t0 = now().timestamp() %}
          {% set fut = all_prices | selectattr('ts', 'ge', t0) | selectattr('ts', 'le', t0 + 86400) | list %}
          {{ ((fut | map(attribute='p') | sum) / (fut | length)) | round(2) if fut | length > 0 else 'unknown' }}

      - name: Cheapest window start
        unique_id: cheapest_window_start
        device_class: timestamp
        icon: mdi:clock-check-outline
        availability: '{{ best.start is not none }}'
        state: '{{ best.start }}'
        attributes:
          end: '{{ best.end }}'
          average_price: '{{ best.avg }}'
          periods: '{{ best.slots }}'
          day: "{{ 'today' if best.day == 0 else 'tomorrow' }}"
          status: '{{ best.status }}'

      - name: Cheapest window price
        unique_id: cheapest_window_price
        unit_of_measurement: c/kWh
        icon: mdi:cash-check
        availability: '{{ best.avg is not none }}'
        state: '{{ best.avg }}'

      # How much cheaper per kWh the window is than starting a run of the same length now
      - name: Cheapest window saving
        unique_id: cheapest_window_saving
        unit_of_measurement: c/kWh
        icon: mdi:piggy-bank
        availability: '{{ best.avg is not none }}'
        state: >
          {% set n = best.slots | int(4) %}
          {% set now_run = all_prices | selectattr('ts', 'ge', now().timestamp()) | list %}
          {{ ((now_run[:n] | map(attribute='p') | sum) / n - best.avg | float(0)) | round(2)
             if now_run | length >= n else 'unknown' }}

    binary_sensor:
      # On when the current price is at or below the next 24 hours' average. For automations.
      - name: Electricity cheap now
        unique_id: electricity_cheap_now
        icon: mdi:thumb-up
        availability: '{{ all_prices | count > 0 }}'
        state: >
          {% set t0 = now().timestamp() %}
          {% set fut = all_prices | selectattr('ts', 'ge', t0) | selectattr('ts', 'le', t0 + 86400) | list %}
          {{ fut | length > 0
             and states('sensor.electricity_price_now') | float(999)
                 <= (fut | map(attribute='p') | sum) / (fut | length) }}
